<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnage">
<title>Carnage Arena Mobile</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
</head>
<body>
  <div id="hud">
    <div id="health-wrap"><div id="health-bar"></div></div>
    <div id="score">Score: 0</div>
    <div id="wave">Level: 1</div>
    <div id="weapon-status" class="hidden"></div>
  </div>
  <canvas id="game"></canvas>

  <div id="control-bar">
    <div id="move-stick">
      <div class="stick-base"></div>
      <div class="stick-knob"></div>
    </div>
    <div id="look-zone">
      <div class="stick-base"></div>
      <div class="stick-knob"></div>
    </div>
  </div>

  <div id="overlay">
    <h1>CARNAGE ARENA</h1>
    <p>Move stick (bottom-left) to walk. Touch and drag the bottom-right to aim &amp; fire.</p>
    <p class="hint">Brutes tank hits. Spitters snipe from range. Use cover. Grab drops.</p>
    <div id="settings">
      <label for="speed-slider">Move Speed</label>
      <input type="range" id="speed-slider" min="0.4" max="1.3" step="0.05">
      <span id="speed-value"></span>
    </div>
    <div id="settings">
      <label for="control-size-slider">Control Size</label>
      <input type="range" id="control-size-slider" min="110" max="220" step="10">
      <span id="control-size-value"></span>
    </div>
    <button id="start-btn">Start</button>
  </div>
  <div id="gameover" class="hidden">
    <h1>YOU DIED</h1>
    <p id="final-score"></p>
    <button id="restart-btn">Retry</button>
  </div>
  <script src="core.js"></script>
  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
